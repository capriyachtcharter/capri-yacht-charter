name: Deploy to Vercel

# Production deploys of capriyachtcharter.com (Vercel project capri-yacht-charter, team The Bare).
# Every push to main deploys. Mosto CMS publishes are commits on main too: the home and the
# list pages already show them live (ISR); the deploy refreshes the pages that read the
# bundled data (tour and boat detail pages). The wait + concurrency below batch a burst of
# CMS edits into one deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_onN8VYd3D9ygjERey7BQUYGv
      VERCEL_PROJECT_ID: prj_wzxiCLqluDGNWuhOz0BAwHSMEOZS
    steps:
      - name: Wait for more edits (one deploy per burst)
        if: github.event_name == 'push'
        run: sleep 90
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
